name: Deploy tracker to GitHub Pages

on:
  push:
    branches: [main, claude/gifted-fermat-8rnnn7]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Publish only the site files (not the workflow or other repo files).
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js _site/
          if [ -d pyq ]; then cp -r pyq _site/; fi
          # Cache-bust: every deploy gets new asset URLs, so browsers never mix old JS/CSS with new HTML.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
