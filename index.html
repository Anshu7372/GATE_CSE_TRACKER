<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://api.anthropic.com; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>GATE CSE 2027 Tracker</title>
  <meta name="description" content="GATE CSE 2027 AIR-1 tracker — auto day-by-day plan, syllabus depth map, PYQ quiz with auto error log, revision queue, Pomodoro, mocks analysis and short notes.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo">🎯</div>
        <div><div class="brand-title">GATE CSE 2027</div><div class="brand-sub" id="hello">Target: AIR 1 🎯</div></div>
      </div>
      <nav class="nav" id="nav" aria-label="Pages">
        <a href="#dashboard" data-v="dashboard">📊 Dashboard</a>
        <a href="#today" data-v="today">📅 Aaj</a>
        <a href="#syllabus" data-v="syllabus">📚 Syllabus</a>
        <a href="#quiz" data-v="quiz">✍️ PYQ Quiz</a>
        <a href="#pyqmap" data-v="pyqmap">🗺 PYQ Map</a>
        <a href="#schedule" data-v="schedule">🗓 Schedule</a>
        <a href="#pomodoro" data-v="pomodoro">🍅 Pomodoro</a>
        <a href="#revision" data-v="revision">🔁 Revision <span class="nav-badge" id="revBadge"></span></a>
        <a href="#mocks" data-v="mocks">📝 Mocks</a>
        <a href="#notes" data-v="notes">🗒 Short Notes</a>
        <a href="#errors" data-v="errors">❌ Error Log <span class="nav-badge" id="errBadge"></span></a>
        <a href="#claude" data-v="claude">🤖 Claude</a>
        <a href="#settings" data-v="settings">⚙️ Settings</a>
      </nav>
      <div class="mini-timer" id="miniTimer" hidden></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/syllabus.js?v=dev"></script>
  <script src="js/data.js?v=dev"></script>
  <script src="js/pyq-bank.js?v=dev"></script>
  <script src="js/core.js?v=dev"></script>
  <script src="js/views.js?v=dev"></script>
  <script src="js/mocks.js?v=dev"></script>
  <script src="js/app.js?v=dev"></script>
</body>
</html>
